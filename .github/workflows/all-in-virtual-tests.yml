name: UF1Cash Five-Sport Virtual R25000 Challenge (R0)

on:
  pull_request:
    paths:
      - 'scripts/all_in_challenge.py'
      - 'scripts/uf1cash_challenge.py'
      - 'scripts/uf1cash_virtual_markets.py'
      - 'tests/test_uf1cash_virtual_markets.py'
      - 'docs/UF1CASH_VIRTUAL_MARKETS.md'
      - 'records/uf1cash/challenge-policy-v3.json'
      - 'public/uf1cash-status.json'
      - 'tests/test_all_in_challenge.py'
      - 'scripts/f1_public_feed.py'
      - 'scripts/uf1cash_f1_ratings.py'
      - 'scripts/uf1cash_openf1_freshness.py'
      - 'tests/test_uf1cash_openf1_freshness.py'
      - 'docs/UF1CASH_OPENF1_SOURCE.md'
      - 'tests/test_uf1cash_f1_ratings.py'
      - 'scripts/multisport_markets.py'
      - 'scripts/cricsheet_history.py'
      - 'scripts/uf1cash_daily_radar.py'
      - 'scripts/uf1cash_odds_discovery.py'
      - 'scripts/uf1cash_simulation_lab.py'
      - 'tests/test_uf1cash_simulation_lab.py'
      - 'scripts/uf1cash_forecast_skill.py'
      - 'tests/test_uf1cash_forecast_skill.py'
      - 'research/uf1cash-synthetic-risk-scenarios-v1.json'
      - 'docs/UF1CASH_SIMULATION_SKILLS.md'
      - 'public/uf1cash-simulations.html'
      - 'tests/test_uf1cash_odds_discovery.py'
      - 'public/index.html'
      - 'docs/UF1CASH_LIVE_DEPLOYMENT_AND_FEEDS.md'
      - 'tests/test_uf1cash_daily_radar.py'
      - 'research/uf1cash-five-sport-fixture-watch.json'
      - 'tests/test_cricket_market.py'
      - 'docs/UF1CASH_FIVE_SPORT_SCOPE.md'
      - 'tests/test_multisport_markets.py'
      - 'docs/RUGBY_HORSE_MARKETS.md'
      - 'tests/test_f1_public_feed.py'
      - '.github/workflows/all-in-virtual-tests.yml'
      - 'research/2026-11-21-qatar-reference-input.json'
  push:
    branches: [main]
    paths:
      - 'scripts/all_in_challenge.py'
      - 'scripts/uf1cash_challenge.py'
      - 'scripts/uf1cash_virtual_markets.py'
      - 'tests/test_uf1cash_virtual_markets.py'
      - 'docs/UF1CASH_VIRTUAL_MARKETS.md'
      - 'records/uf1cash/challenge-policy-v3.json'
      - 'public/uf1cash-status.json'
      - 'tests/test_all_in_challenge.py'
      - 'scripts/f1_public_feed.py'
      - 'scripts/uf1cash_f1_ratings.py'
      - 'scripts/uf1cash_openf1_freshness.py'
      - 'tests/test_uf1cash_openf1_freshness.py'
      - 'docs/UF1CASH_OPENF1_SOURCE.md'
      - 'tests/test_uf1cash_f1_ratings.py'
      - 'scripts/multisport_markets.py'
      - 'scripts/cricsheet_history.py'
      - 'scripts/uf1cash_daily_radar.py'
      - 'scripts/uf1cash_odds_discovery.py'
      - 'scripts/uf1cash_simulation_lab.py'
      - 'tests/test_uf1cash_simulation_lab.py'
      - 'scripts/uf1cash_forecast_skill.py'
      - 'tests/test_uf1cash_forecast_skill.py'
      - 'research/uf1cash-synthetic-risk-scenarios-v1.json'
      - 'docs/UF1CASH_SIMULATION_SKILLS.md'
      - 'public/uf1cash-simulations.html'
      - 'tests/test_uf1cash_odds_discovery.py'
      - 'public/index.html'
      - 'docs/UF1CASH_LIVE_DEPLOYMENT_AND_FEEDS.md'
      - 'tests/test_uf1cash_daily_radar.py'
      - 'research/uf1cash-five-sport-fixture-watch.json'
      - 'tests/test_cricket_market.py'
      - 'docs/UF1CASH_FIVE_SPORT_SCOPE.md'
      - 'tests/test_multisport_markets.py'
      - 'docs/RUGBY_HORSE_MARKETS.md'
      - 'tests/test_f1_public_feed.py'
      - '.github/workflows/all-in-virtual-tests.yml'
      - 'research/2026-11-21-qatar-reference-input.json'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # Daily, approximately 10:00 SAST; GitHub Actions cron may be delayed

permissions:
  contents: read

jobs:
  all-in-unit-tests:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12 on free runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run all-in virtual ZAR and F1 source checks
        run: python -m unittest discover -s tests -p 'test_*all_in_challenge.py' -v && python -m unittest discover -s tests -p 'test_f1_public_feed.py' -v && python -m unittest discover -s tests -p 'test_uf1cash_f1_ratings.py' -v && python -m unittest discover -s tests -p 'test_uf1cash_openf1_freshness.py' -v && python -m unittest discover -s tests -p 'test_multisport_markets.py' -v && python -m unittest discover -s tests -p 'test_cricket_market.py' -v && python -m unittest discover -s tests -p 'test_uf1cash_daily_radar.py' -v && python -m unittest discover -s tests -p 'test_uf1cash_virtual_markets.py' -v && python -m unittest discover -s tests -p 'test_uf1cash_odds_discovery.py' -v && python -m unittest discover -s tests -p 'test_uf1cash_simulation_lab.py' -v && python -m unittest discover -s tests -p 'test_uf1cash_forecast_skill.py' -v
      - name: Re-run historical scenario without altering frozen models
        run: |
          python -m scripts.all_in_challenge historical --input research/2026-11-21-qatar-reference-input.json --output /tmp/basket.json --bankroll 2000 --strategy BASKET
          python -m scripts.all_in_challenge historical --input research/2026-11-21-qatar-reference-input.json --output /tmp/single.json --bankroll 2000 --strategy SINGLE
  five-sport-readonly-observation:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch read-only F1 source schedule without odds or bets
        continue-on-error: true
        run: python -m scripts.f1_public_feed --year $(date -u +%Y) --output results/virtual/f1-observation.json
      - name: Audit historical F1 race ratings without placing future paper bets
        continue-on-error: true
        run: |
          python -m scripts.uf1cash_f1_ratings --years 2024 2025 2026 --asof "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --output results/virtual/f1-historical-ratings.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('results/virtual/f1-historical-ratings.json').read_text())
          assert s['newPaperBets']==0 and s['realBets']==0 and not s['paperBetEligible']
          print('F1 historical rounds',s['historicalRacesProcessed'])
          PY
      - name: Check latest finished 2026 race from independent OpenF1 historical source
        continue-on-error: true
        run: |
          python -m scripts.uf1cash_openf1_freshness --year 2026 --output results/virtual/f1-openf1-freshness.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/virtual/f1-openf1-freshness.json').read_text())
          assert v['realBets']==0 and v['virtualBets']==0
          assert v['paperBetEligible'] is False
          PY
      - name: Re-evaluate the source-controlled UF1Cash R25k wallet without betting
        run: |
          python -m scripts.uf1cash_challenge state --wallet public/uf1cash-status.json --policy records/uf1cash/challenge-policy-v3.json --output results/virtual/uf1cash-goal-observation.json
          python - <<'PY'
          import json
          from pathlib import Path
          goal=json.loads(Path('results/virtual/uf1cash-goal-observation.json').read_text())
          assert goal['realBetsPlaced']==0
          assert goal['allInAllocationPercent']==100
          assert goal['targetBalanceZAR']=='25000.00'
          assert goal['strategyReplacementSuggestionAllowed']==goal['goalReached']
          print('Virtual balance',goal['availableBalanceZAR'],'goal remaining',goal['toGoZAR'])
          PY
      - name: Compile five-sport public-fixture watch, never simulate wagers from schedules
        run: |
          python -m scripts.uf1cash_daily_radar --goal results/virtual/uf1cash-goal-observation.json --policy records/uf1cash/challenge-policy-v3.json --watchlist research/uf1cash-five-sport-fixture-watch.json --f1 results/virtual/f1-observation.json --output results/virtual/uf1cash-five-sport-radar.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/virtual/uf1cash-five-sport-radar.json').read_text())
          assert len(r['sports'])==5 and r['validatedPreEventSelections']==0
          assert r['simulatedTicketsCreated']==0 and r['realBetsPlaced']==0
          PY
      - name: Discover source-attributed sports odds coverage without placing paper wagers
        env:
          UF1CASH_ODDS_API_KEY: ${{ secrets.UF1CASH_ODDS_API_KEY }}
        run: |
          python -m scripts.uf1cash_odds_discovery --max-requests 3 --output results/virtual/uf1cash-odds-discovery.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/virtual/uf1cash-odds-discovery.json').read_text())
          assert v['realBets']==0 and v['eligibleSelections']==0
          assert v['status'] in ('NOT_CONNECTED_KEY_REQUIRED','CONNECTED_METADATA_ONLY','PARTIAL_SOURCE_FAILURE')
          PY
      - name: Run repeatable synthetic all-in risk simulations, never alter wallet
        run: |
          python -m scripts.uf1cash_simulation_lab --input research/uf1cash-synthetic-risk-scenarios-v1.json --wallet public/uf1cash-status.json --policy records/uf1cash/challenge-policy-v3.json --output results/virtual/uf1cash-synthetic-stress.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/virtual/uf1cash-synthetic-stress.json').read_text())
          assert r['mode']=='SYNTHETIC_ONLY' and r['noAuthoritativeWalletMutation']
          assert r['trialCount']==20000 and r['noRealBets']
          assert r['reachedGoalCount']+r['ruinCount']+r['survivingBelowGoalCount']==20000
          assert r['originalAvailableVirtualZAR']=='3071.74' and r['virtualGoalZAR']=='25000.00'
          PY
      - name: Publish F1 research observation as ephemeral artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jsa-uf1cash-daily-f1-calendar-and-five-sport-goal
          retention-days: 30
          path: |
            results/virtual/f1-observation.json
            results/virtual/f1-historical-ratings.json
            results/virtual/f1-openf1-freshness.json
            results/virtual/uf1cash-goal-observation.json
            results/virtual/uf1cash-five-sport-radar.json
            results/virtual/uf1cash-odds-discovery.json
            results/virtual/uf1cash-synthetic-stress.json
