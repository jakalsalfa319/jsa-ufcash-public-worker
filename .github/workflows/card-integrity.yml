name: JSA Official Card Integrity Gate (R0)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-integrity.yml"
      - "scripts/card_integrity.py"
      - "checks/test_card_integrity.py"
      - "scripts/settle_event_v2.py"
      - "checks/test_settle_event_v2.py"
      - "scripts/verify_official_results.py"
      - "checks/test_verify_official_results.py"
  workflow_dispatch:
  schedule:
    # One-time event morning source check; guarded against subsequent years.
    - cron: "30 9 21 11 *"

permissions:
  contents: read

concurrency:
  group: jsa-ufc-card-integrity-2026
  cancel-in-progress: true

jobs:
  verify-card:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public repo without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up free Python 3.12 runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned HTML parser needed by result-check tests
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Check event year before scheduled run
        id: date_gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$(date -u +%Y)" == "2026" ]]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Archived event: no further scheduled source checks."
          fi

      - name: Run same-bout and journal-integrity unit tests
        if: steps.date_gate.outputs.execute == 'true'
        run: python -m unittest discover -s checks -p 'test_*.py' -v

      - name: Fetch authoritative UFC event page and verify frozen matches
        if: steps.date_gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          python -m scripts.card_integrity --strict
          python - <<'PY2'
          import json
          from pathlib import Path
          x=json.loads(Path("results/card_integrity.json").read_text())
          assert x["allSevenCurrentlyListed"] and x["listedSameBoutCount"]==7
          assert x["resultsSettled"] is False and x["betsPlaced"] is False
          with Path("results/card_integrity_summary.md").open("w") as f:
              f.write("# Source-only UFC card verification\n\n")
              f.write("UFC event date: "+x["eventDate"]+"\n\n")
              f.write("Same-bout listings: 7 of 7, as of "+x["checkedAtUTC"]+"\n\n")
              f.write("UFC page SHA-256: "+x["sourceHtmlSha256"]+"\n\n")
              f.write("Not proof a fight took place or a profitable bet existed.\n")
          PY2
          cat results/card_integrity_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save research artifact without editing frozen predictions
        if: steps.date_gate.outputs.execute == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jsa-official-card-integrity-2026
          if-no-files-found: error
          retention-days: 30
          path: |
            results/card_integrity.json
            results/card_integrity_summary.md