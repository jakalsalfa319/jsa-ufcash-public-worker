name: JSA Frozen Frontier Future Event Inference (manual, R0)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frozen-future-inference.yml"
      - "scripts/future_card_inference.py"
      - "tests/test_future_card_inference.py"
  workflow_dispatch:
    inputs:
      card_file:
        description: "Reviewed tracked file: cards/reviewed/YYYY-MM-DD.json"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: jsa-frozen-future-inference
  cancel-in-progress: false

jobs:
  check-and-infer:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: jakalsalfa319/jsa-ufcash-public-worker
      APPROVED_SHA256: 727b4a535927157257de84f6a7cc3fd5988aba9cabb98ba6bf84e726dc1a3a97
      RELEASE_TAG: jsa-frontier-v2-fitted-2026-11-20
      CARD_FILE: ${{ github.event.inputs.card_file }}
    steps:
      - name: Checkout unchanged public research repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Python 3.12 on free public runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run dependency-free future event source-security checks
        run: python -m unittest discover -s tests -p 'test_future_card_inference.py' -v

      - name: Validate exactly one reviewed card path and UTC chronology
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os,re
          from pathlib import Path
          from scripts.future_card_inference import valid_card
          from scripts.precision_lab import FEATURES,RATINGS
          filename=os.environ.get("CARD_FILE","")
          if re.fullmatch(r"cards/reviewed/\d{4}-\d{2}-\d{2}\.json",filename) is None:
              raise SystemExit("Only checked-in cards/reviewed/YYYY-MM-DD.json allowed")
          file=Path(filename)
          if not file.is_file() or file.stat().st_size>500000:
              raise SystemExit("Reviewed card file missing/oversized")
          data=json.loads(file.read_text(encoding="utf-8"))
          if filename!=f"cards/reviewed/{data['eventDate']}.json":
              raise SystemExit("Filename and card date differ")
          valid_card(data,dt.datetime.now(dt.timezone.utc),list(FEATURES)+list(RATINGS))
          print("REVIEWED INPUT PREFLIGHT PASS:",filename,len(data["bouts"]),"unscored bouts")
          PY

      - name: Install pinned frozen-model inference dependencies
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input --disable-pip-version-check \
            numpy==2.0.0 pandas==2.2.3 pyarrow==26.0.0 scikit-learn==1.9.1 \
            xgboost==3.4.1 catboost==1.2.10 joblib==1.6.0

      - name: Recheck source contract with complete model dependencies
        if: github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -p 'test_future_card_inference.py' -v

      - name: Obtain only approved SHA-pinned frozen fitted-model release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jsa-frozen-inference
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern 'frozen_frontier_v2_checkpoint.tar.gz' \
            --dir /tmp/jsa-frozen-inference
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          path=Path("/tmp/jsa-frozen-inference/frozen_frontier_v2_checkpoint.tar.gz")
          if hashlib.sha256(path.read_bytes()).hexdigest()!=os.environ["APPROVED_SHA256"]:
              raise SystemExit("Archive corrupted or unknown; refusing pickle deserialization")
          print("Approved model archive SHA-256 verified")
          PY

      - name: Verify official UFC pairings and run FROZEN checkpoint once
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          CARD_DATE="$(basename "$CARD_FILE" .json)"
          python -m scripts.future_card_inference \
            --archive /tmp/jsa-frozen-inference/frozen_frontier_v2_checkpoint.tar.gz \
            --input "$CARD_FILE" \
            --output "results/future-$CARD_DATE.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          date=Path(os.environ["CARD_FILE"]).stem
          data=json.loads(Path(f"results/future-{date}.json").read_text(encoding="utf-8"))
          assert data["schema"]=="JSA_FROZEN_FRONTIER_FUTURE_INFERENCE_V1"
          assert data["modelReleaseTag"]==os.environ["RELEASE_TAG"]
          assert data["checkpointArchiveSha256"]==os.environ["APPROVED_SHA256"]
          assert data["eventCardOfficiallyVerifiedAtFetch"] is True
          assert data["featureContentsIndependentlyAudited"] is False
          assert data["fightResultsVerified"] is False and data["moneyWagered"] is False
          assert all(p["winner"] is None and p["betPlaced"] is False
                     and p["recommendedBet"] is False for p in data["predictions"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("# J$A frozen future-event research\n\n")
              out.write(f"Event {date}: {len(data['predictions'])} same-bout UFC listings.\n\n")
              out.write("Model SHA-256: "+data["checkpointArchiveSha256"]+"\n\n")
              out.write("Research snapshot SHA-256: "+data["snapshotSha256"]+"\n\n")
              out.write("Supplied feature values require independent source-as-of audit; no bets made.\n")
          PY

      - name: Upload read-only research artifact, never overwrite original journal
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jsa-frozen-future-event-research
          retention-days: 30
          if-no-files-found: error
          path: results/future-*.json
