name: JSA UFCash dedicated public worker

on:
  # Archived 21 November 2026 research replay. Deliberately NOT triggered by
  # future-card tests or code edits: upstream UFCash source hashes have changed.
  # It remains manually inspectable and fails closed on source mismatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsa-ufcash-dedicated-public
  cancel-in-progress: false

jobs:
  predict:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      UFCASH_SHA: c6b1e8233b172fde6e2dabb8757d351c1a4a5ede
    steps:
      - name: Checkout dedicated public research repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12 using standard free runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run independent 99.9% evaluation guardrail unit tests
        run: python -m unittest discover -s tests -v

      - name: Retrieve public official-odds reference and verify seven announced matchups
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 --retry 2 \
            "https://jsa-ai-trading-hq.vercel.app/api/ufc-reference-odds" \
            -o reference.json
          mkdir -p card results
          python - <<'PY'
          import csv, datetime as dt, json, pathlib
          x = json.loads(pathlib.Path("reference.json").read_text(encoding="utf-8"))
          expected = [
            ("Jiří Procházka", "Navajo Stirling"),
            ("Aljamain Sterling", "Kevin Vallejos"),
            ("Dan Hooker", "Brian Ortega"),
            ("Kyoji Horiguchi", "Asu Almabayev"),
            ("Jared Cannonier", "Ikram Aliskerov"),
            ("Aleksandre Topuria", "Santiago Luna"),
            ("Shamil Gaziev", "Tallison Teixeira"),
          ]
          assert x["eventDate"] == "2026-11-21" and x["source"] == "UFC.com event page"
          assert x["url"] == "https://www.ufc.com/event/ufc-fight-night-november-21-2026"
          assert x["total"] == 7 and x["matchupsFound"] == 7 and len(x["fights"]) == 7
          assert x["bookmakerIdentified"] is False and x["executable"] is False
          checked = dt.datetime.fromisoformat(x["retrievedAt"].replace("Z", "+00:00"))
          age_hours = (dt.datetime.now(dt.timezone.utc) - checked).total_seconds() / 3600
          assert 0 <= age_hours <= 3, "UFC page data too old; refusing stale input"
          fields = ["date","red","blue","weight_class","rounds","title","card_pos","red_odds","blue_odds"]
          with pathlib.Path("card/upcoming.csv").open("w", newline="", encoding="utf-8") as f:
              writer=csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for i, bout in enumerate(x["fights"]):
                  assert (bout["fighterA"], bout["fighterB"]) == expected[i]
                  assert bout["matchupFound"] and bout["position"] == i
                  assert bout["rounds"] in (3,5) and isinstance(bout["division"],str)
                  a,b=bout["americanA"],bout["americanB"]
                  assert isinstance(a,int) and isinstance(b,int) and abs(a)>=100 and abs(b)>=100
                  assert bout["sourceType"] == "PUBLIC_DISPLAY_REFERENCE" and not bout["executable"]
                  # The UFC event uses an accented display name; the UFCstats mirror uses ASCII.
                  model_red = {"Jiří Procházka": "Jiri Prochazka"}.get(bout["fighterA"], bout["fighterA"])
                  writer.writerow({"date":x["eventDate"],"red":model_red,"blue":bout["fighterB"],
                      "weight_class":bout["division"],"rounds":bout["rounds"],"title":0,
                      "card_pos":i,"red_odds":a,"blue_odds":b})
          print("Verified seven official-page matchups and seven two-sided reference quotes.")
          print("REFERENCE ONLY: source displays are NOT bookmaker opening lines or executable odds.")
          PY

      - name: Clone and verify exact, independently reviewed public UFCash revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/SolvAI/ufcash.git" ufcash
          git -C ufcash checkout --detach "$UFCASH_SHA"
          test "$(git -C ufcash rev-parse HEAD)" = "$UFCASH_SHA"
          cp card/upcoming.csv ufcash/data/upcoming.csv

      - name: Install upstream pinned Python packages
        run: python -m pip install --no-input -r ufcash/requirements.txt

      - name: Verify NumPy/Pandas research invariants with pinned ML dependencies
        run: python -m unittest discover -s tests -v

      - name: Download public data and build UFCash pre-fight feature history
        run: |
          cd ufcash
          python ufcash.py setup

      - name: Run actual UFCash trained model on verified Qatar card
        run: |
          cd ufcash
          python ufcash.py card
          test -s results/upcoming_predictions.csv

      - name: Build independently implemented Elo challenger and historical holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/elo_challenger.py
          test -s results/elo_challenger.json

      - name: Train odds-free feature challenger with sealed 2025-2026 holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/precision_lab.py
          test -s results/precision_lab.json

      - name: Run fixed four-family quarterly 2026 replay
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.rolling_2026
          test -s results/rolling_2026_summary.json
          test -s results/rolling_2026_predictions.json

      - name: Freeze pre-event research journal only when truly before event
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.prospective_journal
          test -s results/prospective_journal.json

      - name: Run accuracy frontier with 2025-only selection and 2026 full-cohort comparison
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.accuracy_frontier
          test -s results/accuracy_frontier_2026.json
          test -s results/frozen_frontier_v2_checkpoint.tar.gz
          test -s results/frozen_frontier_v2_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("results/accuracy_frontier_2026.json").read_text())
          audit=v["reproducibility"]
          assert audit["threadPolicy"]=="single-thread tree models and BLAS/OpenMP"
          hashes=audit["probabilityHashesSha256"]
          assert "chosen_ensemble" in hashes and all(len(h)==64 for h in hashes.values())
          with Path("/tmp/jsa-fingerprints.txt").open("w") as f:
              f.write("## Fixed-precision model probability hashes\n\n")
              f.write("\n".join(key+": "+value for key,value in sorted(hashes.items()))+"\n")
          print("Frontier model exact probability fingerprints verified.")
          PY
          cat /tmp/jsa-fingerprints.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Audit historical 2026 model disagreement, experience and layoff risk
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.frontier_resilience
          test -s results/frontier_cases.json
          test -s results/frontier_resilience.json

      - name: Evaluate historical specialist challenger with 2025-only policy selection
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.frontier_specialists
          test -s results/specialist_lab_v3.json

      - name: Evaluate deterministic 40-30-30 model excluding unstable hist booster
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.stable_frontier_v4
          test -s results/frontier_components.json
          test -s results/stable_frontier_v4.json

      - name: Validate predictions and generate provenance report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,datetime as dt,hashlib,json,pathlib,os
          root=pathlib.Path("ufcash")
          prediction=root/"results/upcoming_predictions.csv"
          with prediction.open(encoding="utf-8", newline="") as f:
              rows=list(csv.DictReader(f))
          assert rows and all(x.get("model_p_red","") for x in rows), "Missing model predictions"
          expected={"Jiri Prochazka","Aljamain Sterling","Dan Hooker","Kyoji Horiguchi","Jared Cannonier","Aleksandre Topuria","Shamil Gaziev"}
          matched={x.get("red") for x in rows}
          assert expected.issubset(matched), "Predictions missing confirmed fighter rows"
          main=next((x for x in rows if x.get("red") == "Jiri Prochazka"), None)
          assert main and int(main.get("red_ufc_fights", 0)) >= 5, "Main-event fighter ID unresolved: UFC history missing"
          files={}
          for path in sorted((root/"data/raw").rglob("*")):
              if not path.is_file(): continue
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for part in iter(lambda:f.read(1048576),b""):h.update(part)
              files[str(path.relative_to(root))]={"sha256":h.hexdigest(),"bytes":path.stat().st_size}
          report={"runAt":dt.datetime.now(dt.timezone.utc).isoformat(),"model":"SolvAI/ufcash",
            "modelCommit":os.environ["UFCASH_SHA"],"eventDate":"2026-11-21",
            "canonicalNameMap":{"Jiří Procházka":"Jiri Prochazka"},
            "inputSource":"https://jsa-ai-trading-hq.vercel.app/api/ufc-reference-odds",
            "inputType":"UFC public display REFERENCE odds, not original opening prices",
            "predictionCount":len(rows),"modelOutput":str(prediction),"rawDataHashes":files,
            "notVerified":["Executable bookmaker odds","Profitable live strategy","Real bets","Opening line ROI"]}
          pathlib.Path("results/provenance.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          pathlib.Path("results/summary.txt").write_text(
            f"UFCash actual inference: {len(rows)} predictions. Reference inputs, no validated live betting edge. See provenance.json.\n",encoding="utf-8")
          print("MODEL COMPLETED:",len(rows),"predictions")
          PY
          cat results/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public research only (30-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jsa-ufcash-public-research
          if-no-files-found: error
          retention-days: 30
          path: |
            ufcash/results/upcoming_predictions.csv
            card/upcoming.csv
            reference.json
            results/provenance.json
            results/elo_challenger.json
            results/precision_lab.json
            results/rolling_2026_summary.json
            results/accuracy_frontier_2026.json
            results/frozen_frontier_v2_checkpoint.tar.gz
            results/frozen_frontier_v2_receipt.json
            results/frontier_cases.json
            results/frontier_resilience.json
            results/specialist_lab_v3.json
            results/frontier_components.json
            results/stable_frontier_v4.json
            results/rolling_2026_predictions.json
            results/prospective_journal.json
            results/summary.txt


  publish-frozen-model:
    name: Preserve one fitted Frontier checkpoint as a versioned GitHub Release
    needs: predict
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: jsa-frontier-v2-fitted-2026-11-20
    steps:
      - name: Read-only checkout for release documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download finished same-run model archive from public research job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jsa-signed-model
          gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" \
            --name jsa-ufcash-public-research --dir /tmp/jsa-signed-model
          test -s /tmp/jsa-signed-model/results/frozen_frontier_v2_checkpoint.tar.gz
          test -s /tmp/jsa-signed-model/results/frozen_frontier_v2_receipt.json

      - name: Verify archive checksum and refuse nonapproved model release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,tarfile
          from pathlib import Path
          root=Path("/tmp/jsa-signed-model/results")
          path=root/"frozen_frontier_v2_checkpoint.tar.gz"
          receipt=json.loads((root/"frozen_frontier_v2_receipt.json").read_text())
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          assert receipt["schema"]=="JSA_FRONTIER_FROZEN_RECEIPT_V1"
          assert actual==receipt["archiveSha256"], "Archive checksum mismatch"
          assert receipt["inputSourcesCount"]==9 and receipt["fixtureReplayed"]>=20
          assert receipt["model"]=="Frontier v2 selected 2025 H2"
          assert receipt["prospectiveAccuracyVerified"] is False
          with tarfile.open(path,"r:gz") as tar:
              names=set(tar.getnames())
              expected={"manifest.json","models/recent_logistic.joblib",
                        "models/hist_boost.joblib","models/xgboost.joblib",
                        "models/catboost.joblib"}
              assert names==expected
              manifest_bytes=tar.extractfile("manifest.json").read()
              manifest=json.loads(manifest_bytes)
              assert hashlib.sha256(manifest_bytes).hexdigest()==receipt["manifestSha256"]
              assert manifest["schema"]=="JSA_FRONTIER_FITTED_CHECKPOINT_V1"
              assert manifest["selectionMadeWithout2026Outcomes"] is True
              assert manifest["trainingSourceSha256"]["data/raw/canon/canon.db"]=="8185a2163b5f97071dbc4ec68667cceb43f5e321fadc38c26b5069303af4d949"
          print("APPROVED FITTED CHECKPOINT",actual,"historical correct",receipt["historic2026Correct"])
          PY

      - name: Publish first-success frozen model once or preserve existing tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Existing frozen model release retained unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > /tmp/jsa-frozen-release-notes.md <<'EOF'
          FRONTIER V2 - ONE FITTED CHECKPOINT (20 NOVEMBER 2026)

          The assets contain fitted research objects, model feature schema,
          pre-fight source hashes, 2025 calibration and selected confidence
          gate, plus a separate archive SHA-256 receipt.

          This is a newly fitted model. It does NOT recreate the historical
          176/266 archived backtest model. This snapshot's own historical 2026
          result is recorded in the receipt.

          Loading an untrusted joblib/pickle can execute code. Check the
          SHA-256 from the external release receipt before model deserialization.

          Retrospective model performance is not proof of profitable betting,
          99.9% accuracy or prospective predictive power. No bets placed.
          EOF
          gh release create "$TAG" \
            /tmp/jsa-signed-model/results/frozen_frontier_v2_checkpoint.tar.gz \
            /tmp/jsa-signed-model/results/frozen_frontier_v2_receipt.json \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title 'J$A Frontier v2 - frozen fitted ensemble (research)' \
            --notes-file /tmp/jsa-frozen-release-notes.md --latest=false
          echo "Frozen model release created without modifying historic forecasts." >> "$GITHUB_STEP_SUMMARY"
