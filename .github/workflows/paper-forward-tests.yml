name: JSA UFCash Forward Paper Gate (R0)

on:
  pull_request:
    paths:
      - ".github/workflows/paper-forward-tests.yml"
      - "scripts/paper_forward.py"
      - "tests/test_paper_forward.py"
      - "docs/PAPER_FORWARD_PROTOCOL.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-forward-tests.yml"
      - "scripts/paper_forward.py"
      - "tests/test_paper_forward.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-safety-tests:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout with no credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: No-money forward trial integrity and accounting tests
        run: python -m unittest discover -s tests -p test_paper_forward.py -v