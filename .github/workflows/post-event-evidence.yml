name: JSA UFC Qatar Post-Event Evidence Audit (R0)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/post-event-evidence.yml"
      - "scripts/verify_official_results.py"
      - "checks/test_verify_official_results.py"
  workflow_dispatch:
  schedule:
    # Two UTC evidence checks after the Nov 21 event; year-guarded.
    - cron: "0 12 22,23 11 *"

permissions:
  contents: read

concurrency:
  group: jsa-ufc-2026-post-event-source-audit
  cancel-in-progress: false

jobs:
  verify-source-results:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source-only repo with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.12 on free runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned HTML parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Run official-source anti-hindsight verification tests
        run: python -m unittest discover -s checks -p 'test_*.py' -v

      - name: Ensure event has begun and reject future years
        id: gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%Y)" != "2026" ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Year guard: no scheduled checks after 2026." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$(date -u +%Y%m%d%H%M)" < "202611211500" ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Event has not started, so scoring is forbidden." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "execute=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Independently verify completed UFCStats fights and reconcile models
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_official_results --output results/official_outcomes_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("results/official_outcomes_audit.json").read_text(encoding="utf-8"))
          r=x["result"]
          assert x["schema"]=="JSA_UFCSTATS_SOURCE_AUDIT_V1"
          assert r["expected"]==7 and r["automatedBets"] is False
          assert r["automaticPublicationApproved"] is False
          assert x["publishedFinalAccuracy"] is False
          with Path("results/official_outcomes_summary.md").open("w",encoding="utf-8") as file:
              file.write("# J$A post-event UFCStats source audit\n\n")
              file.write("Checked UTC: "+x["createdUTC"]+"\n\n")
              file.write("Status: "+r["status"]+"\n\n")
              file.write("Decisive fights with matching source evidence: "+str(r["verifiedDecisiveBouts"])+" of 7\n\n")
              if x["observations"].get("sourceFailure"):
                  file.write("Source limitation: "+x["observations"]["sourceFailure"]+"\n\n")
              file.write("**Research artifact only. No bookmaker bets, financial return claims or edits to frozen forecasts.**\n")
          PY
          cat results/official_outcomes_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provenance and model scores for review only
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jsa-official-ufcstats-outcome-audit
          if-no-files-found: error
          retention-days: 30
          path: |
            results/official_outcomes_audit.json
            results/official_outcomes_summary.md
