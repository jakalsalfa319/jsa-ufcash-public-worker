name: JSA Research Audit Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-tests.yml"
      - "scripts/settle_prospective.py"
      - "tests/test_settle_prospective.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsa-research-tests
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up free Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test pre-event snapshot integrity and independently sourced settlement
        run: python -m unittest discover -s tests -p 'test_*prospective*.py' -v
