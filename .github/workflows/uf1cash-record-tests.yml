name: UF1Cash ledger integrity and scope (R0)

on:
  pull_request:
    paths:
      - '.github/workflows/uf1cash-record-tests.yml'
      - 'scripts/uf1cash_status.py'
      - 'scripts/uf1cash_simulation_lab.py'
      - 'tests/test_uf1cash_simulation_lab.py'
      - 'scripts/uf1cash_forecast_skill.py'
      - 'tests/test_uf1cash_forecast_skill.py'
      - 'tests/test_uf1cash_paired_baseline.py'
      - 'scripts/uf1cash_holdout_integrity.py'
      - 'tests/test_uf1cash_holdout_integrity.py'
      - 'scripts/uf1cash_dataset_integrity.py'
      - 'tests/test_uf1cash_dataset_integrity.py'
      - 'research/uf1cash-synthetic-risk-scenarios-v1.json'
      - 'docs/UF1CASH_SIMULATION_SKILLS.md'
      - 'public/uf1cash-simulations.html'
      - 'scripts/uf1cash_virtual_markets.py'
      - 'tests/test_uf1cash_virtual_markets.py'
      - 'docs/UF1CASH_VIRTUAL_MARKETS.md'
      - 'scripts/multisport_markets.py'
      - 'scripts/cricsheet_history.py'
      - 'tests/test_cricket_market.py'
      - 'docs/UF1CASH_FIVE_SPORT_SCOPE.md'
      - 'scripts/uf1cash_challenge.py'
      - 'tests/test_uf1cash_challenge.py'
      - 'records/uf1cash/challenge-policy-v3.json'
      - 'public/uf1cash-goal.json'
      - 'docs/UF1CASH_25K_CHALLENGE.md'
      - 'scripts/uf1cash_partial_settlement.py'
      - 'tests/test_uf1cash_status.py'
      - 'tests/test_uf1cash_partial_settlement.py'
      - 'research/uf1cash-qatar-2026-11-21-evidence-v1.json'
      - 'public/uf1cash-status.json'
      - 'records/uf1cash/status-snapshot-v1.json'
      - 'records/uf1cash/wallet-rollover-authorization-v2.json'
      - 'records/uf1cash/2026-11-21-qatar-whatif-v1.json'
      - 'public/uf1cash.html'
      - 'docs/UF1CASH_OPERATING_RECORD.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/uf1cash-record-tests.yml'
      - 'scripts/uf1cash_status.py'
      - 'scripts/uf1cash_simulation_lab.py'
      - 'tests/test_uf1cash_simulation_lab.py'
      - 'scripts/uf1cash_forecast_skill.py'
      - 'tests/test_uf1cash_forecast_skill.py'
      - 'tests/test_uf1cash_paired_baseline.py'
      - 'scripts/uf1cash_holdout_integrity.py'
      - 'tests/test_uf1cash_holdout_integrity.py'
      - 'scripts/uf1cash_dataset_integrity.py'
      - 'tests/test_uf1cash_dataset_integrity.py'
      - 'research/uf1cash-synthetic-risk-scenarios-v1.json'
      - 'docs/UF1CASH_SIMULATION_SKILLS.md'
      - 'public/uf1cash-simulations.html'
      - 'scripts/uf1cash_virtual_markets.py'
      - 'tests/test_uf1cash_virtual_markets.py'
      - 'docs/UF1CASH_VIRTUAL_MARKETS.md'
      - 'scripts/multisport_markets.py'
      - 'scripts/cricsheet_history.py'
      - 'tests/test_cricket_market.py'
      - 'docs/UF1CASH_FIVE_SPORT_SCOPE.md'
      - 'scripts/uf1cash_challenge.py'
      - 'tests/test_uf1cash_challenge.py'
      - 'records/uf1cash/challenge-policy-v3.json'
      - 'public/uf1cash-goal.json'
      - 'docs/UF1CASH_25K_CHALLENGE.md'
      - 'scripts/uf1cash_partial_settlement.py'
      - 'tests/test_uf1cash_status.py'
      - 'tests/test_uf1cash_partial_settlement.py'
      - 'research/uf1cash-qatar-2026-11-21-evidence-v1.json'
      - 'public/uf1cash-status.json'
      - 'records/uf1cash/status-snapshot-v1.json'
      - 'records/uf1cash/wallet-rollover-authorization-v2.json'
      - 'records/uf1cash/2026-11-21-qatar-whatif-v1.json'
      - 'public/uf1cash.html'
      - 'docs/UF1CASH_OPERATING_RECORD.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-ledger-audit:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test immutable-wallet and retrospective separation
        run: python -m unittest discover -s tests -p 'test_uf1cash_status.py' -v
      - name: Recompute current source-controlled virtual wallet status
        run: |
          python -m scripts.uf1cash_status --output /tmp/uf1cash-status-rebuilt.json
          python - <<'PY'
          import json
          from pathlib import Path
          left=json.loads(Path('/tmp/uf1cash-status-rebuilt.json').read_text())
          right=json.loads(Path('public/uf1cash-status.json').read_text())
          assert left == right, 'UF1Cash wallet status out of sync with generator'
          PY
      - name: Verify R25k goal lock and full current wallet exposure
        run: |
          python -m unittest discover -s tests -p 'test_uf1cash_challenge.py' -v
          python -m scripts.uf1cash_challenge state --wallet public/uf1cash-status.json --policy records/uf1cash/challenge-policy-v3.json --output /tmp/uf1cash-goal-ci.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/uf1cash-goal-ci.json').read_text()) == json.loads(Path('public/uf1cash-goal.json').read_text())
          PY
      - name: Test partial virtual settlement (pending stake remains locked)
        run: python -m unittest discover -s tests -p 'test_uf1cash_partial_settlement.py' -v
      - name: Test five-sport cross-market validation and history cutoff
        run: python -m unittest discover -s tests -p 'test_cricket_market.py' -v
      - name: Test multi-market virtual ticket contracts and safe settlement
        run: python -m unittest discover -s tests -p 'test_uf1cash_virtual_markets.py' -v
      - name: Test synthetic bankroll stress, correlation and chronological forecast scoring
        run: |
          python -m unittest discover -s tests -p 'test_uf1cash_simulation_lab.py' -v
          python -m unittest discover -s tests -p 'test_uf1cash_forecast_skill.py' -v
          python -m unittest discover -s tests -p 'test_uf1cash_paired_baseline.py' -v
          python -m unittest discover -s tests -p 'test_uf1cash_holdout_integrity.py' -v
          python -m unittest discover -s tests -p 'test_uf1cash_dataset_integrity.py' -v
      - name: Confirm original all-in controls still pass
        run: python -m unittest discover -s tests -p 'test_all_in_challenge.py' -v
