name: JSA Independently Verify Frozen Fitted Model (R0)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-fitted-checkpoint.yml"
      - "scripts/model_checkpoint.py"
      - "tests/test_model_checkpoint.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsa-independent-fitted-frontier-verify
  cancel-in-progress: true

jobs:
  replay-public-release:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: jsa-frontier-v2-fitted-2026-11-20
      APPROVED_SHA256: 727b4a535927157257de84f6a7cc3fd5988aba9cabb98ba6bf84e726dc1a3a97
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Read public research code without storing Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.12 for pinned model serialization versions
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install precisely the original public fitted-model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input --disable-pip-version-check \
            numpy==2.0.0 pandas==2.2.3 pyarrow==26.0.0 scikit-learn==1.9.1 \
            xgboost==3.4.1 catboost==1.2.10 joblib==1.6.0

      - name: Get the signed-off public model without retraining or secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jsa-fitted-verified
          gh release download "$TAG" --repo "$GH_REPO" \
            --pattern 'frozen_frontier_v2_*' --dir /tmp/jsa-fitted-verified
          test -s /tmp/jsa-fitted-verified/frozen_frontier_v2_checkpoint.tar.gz
          test -s /tmp/jsa-fitted-verified/frozen_frontier_v2_receipt.json

      - name: Validate release archive SHA and replay exact fitted probabilities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          import numpy as np
          from scripts.model_checkpoint import load_checkpoint,combine
          folder=Path("/tmp/jsa-fitted-verified")
          path=folder/"frozen_frontier_v2_checkpoint.tar.gz"
          receipt=json.loads((folder/"frozen_frontier_v2_receipt.json").read_text())
          assert receipt["archiveSha256"]==os.environ["APPROVED_SHA256"]
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ["APPROVED_SHA256"]
          loaded=load_checkpoint(path,os.environ["APPROVED_SHA256"])
          manifest=loaded["manifest"]
          assert manifest["historical2026Correct"]==176
          assert manifest["historical2026Eligible"]==266
          assert manifest["selectionMadeWithout2026Outcomes"] is True
          assert manifest["ensembleWeights"]==[.4,.2,.2,.2]
          assert manifest["gateThreshold"]==.65
          x=np.asarray(manifest["sampleFixture"]["x"],dtype=float)
          old=np.asarray(manifest["sampleFixture"]["expectedProbability"],dtype=float)
          new=combine(loaded["models"],x,manifest["symmetricPlattSlope"])
          assert np.allclose(new,old,atol=2e-10,rtol=0)
          inverted=combine(loaded["models"],-x,manifest["symmetricPlattSlope"])
          delta=np.abs(new+inverted-1)
          print("Maximum fighter-corner inversion deviation:",float(np.max(delta)))
          print("Inversion residual sample:",[float(q) for q in delta[:8]])
          assert float(np.max(delta))<1e-6, "Fitted model violates corner invariance beyond 1e-6"
          print("INDEPENDENT RESTORE PASSED on",len(x),"historical feature vectors")
          print("Model archive SHA-256:",os.environ["APPROVED_SHA256"])
          print("Historical benchmark:",manifest["historical2026Correct"],"/",manifest["historical2026Eligible"])
          print("No retraining, no bets placed, no verified positive financial returns.")
          PY
          echo "Frozen fitted model independently restored, exact probabilities replayed on 24 validation vectors; corner reversal tolerance checked." >> "$GITHUB_STEP_SUMMARY"

      - name: Rerun dedicated frozen-model corruption and restore tests
        run: python -m unittest discover -s tests -p 'test_model_checkpoint.py' -v
