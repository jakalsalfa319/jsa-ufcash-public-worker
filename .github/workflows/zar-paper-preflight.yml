name: UFCash ZAR prospective paper preflight (R0)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zar-paper-preflight.yml"
      - "scripts/zar_preflight.py"
      - "tests/test_zar_preflight.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zar-paper-preflight.yml"
      - "scripts/zar_preflight.py"
      - "tests/test_zar_preflight.py"
      - "research/*-future-watchlist.json"
      - "paper/inputs/*.json"
  workflow_dispatch:
  schedule:
    # 15:00 Africa/Johannesburg on Monday and Friday (GitHub may delay cron jobs).
    - cron: "0 13 * * 1,5"

permissions:
  contents: read

concurrency:
  group: ufcash-zar-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'jakalsalfa319/jsa-ufcash-public-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout public repo without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test no-bet and invalid-evidence gates
        run: python -m unittest discover -s tests -p 'test_zar_preflight.py' -v
      - name: Audit dated future UFC card watchlist without inventing bets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/zar-preflight
          python -m scripts.zar_preflight \
            --input research/2026-12-05-future-watchlist.json \
            --output results/zar-preflight/2026-12-05-watchlist.json
          echo "## UFCash R0 paper preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA. Checked UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')." >> "$GITHUB_STEP_SUMMARY"
          echo "The watchlist itself cannot create a paper order or prove an edge." >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze individually reviewed genuine pre-event inputs, only if committed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          import subprocess
          import sys
          from scripts.paper_forward import utc, INPUT_SCHEMA
          files = sorted(Path("paper/inputs").glob("*.json"))
          print(f"Found {len(files)} manually sourced prospective paper input file(s).")
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("schema") != INPUT_SCHEMA:
                  raise ValueError(f"Unexpected input schema: {path}")
              if utc(data["eventStartUTC"]) <= dt.datetime.now(dt.timezone.utc):
                  print(f"SKIP expired event; no retroactive tickets: {path.name}")
                  continue
              output = Path("results/zar-preflight") / (path.stem + "-frozen.json")
              subprocess.run([sys.executable, "-m", "scripts.paper_forward",
                  "freeze", "--input", str(path), "--output", str(output)], check=True)
              print(f"PRE-EVENT RESEARCH RECEIPT: {output} (not an executable bet)")
          PY
      - name: Archive research receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ufcash-zar-prospective-preflight
          retention-days: 30
          if-no-files-found: error
          path: results/zar-preflight/
